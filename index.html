<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zen ASMR Lab - YouTube Playable</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFC">
  
  <!-- Official YouTube Playables SDK synchronously loaded first -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  
  <!-- Modern Clean Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-app">
    <!-- Top Header Bar -->
    <header id="game-header">
      <div class="progress-box">
        <div class="progress-info">
          <span id="tingle-rank" class="rank-badge">Lv.1 Zen Beginner</span>
          <span class="tingle-label">✨ ASMR Tingles</span>
        </div>
        <div class="progress-track">
          <div id="tingle-progress" class="progress-fill" style="width: 5%;"></div>
        </div>
      </div>

      <div class="header-actions">
        <button id="btn-ambient" class="icon-btn" title="Toggle Calming Rain Sound" aria-label="Rain Sound">🌧️</button>
        <button id="btn-mute" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
      </div>
    </header>

    <!-- Interactive Game Canvas Container -->
    <main id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </main>

    <!-- Bottom Controls & Navigation -->
    <footer id="game-footer">
      <!-- Quick Action Controls for Active Station -->
      <div class="station-actions">
        <button id="btn-variant" class="action-btn">🎨 Change Style</button>
        <button id="btn-reset" class="action-btn secondary">🔄 Reset</button>
      </div>

      <!-- Station Selector Navigation Tabs -->
      <nav id="station-nav">
        <button class="station-tab active" data-station="0">
          <span class="tab-icon">🔪</span>
          <span class="tab-label">Sand Slice</span>
        </button>
        <button class="station-tab" data-station="1">
          <span class="tab-icon">🍑</span>
          <span class="tab-label">Slime Squish</span>
        </button>
        <button class="station-tab" data-station="2">
          <span class="tab-icon">💖</span>
          <span class="tab-label">Pop-It</span>
        </button>
        <button class="station-tab" data-station="3">
          <span class="tab-icon">💥</span>
          <span class="tab-label">Crusher</span>
        </button>
        <button class="station-tab" data-station="4">
          <span class="tab-icon">🔔</span>
          <span class="tab-label">Zen Chimes</span>
        </button>
      </nav>
    </footer>
  </div>

  <!-- Local Game Scripts (No external CDN dependencies for YouTube Playables compliance) -->
  <script src="js/yt-sdk.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/stations/sand-slicer.js"></script>
  <script src="js/stations/slime-jelly.js"></script>
  <script src="js/stations/pop-it.js"></script>
  <script src="js/stations/hydraulic-press.js"></script>
  <script src="js/stations/zen-chimes.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
