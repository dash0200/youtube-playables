[package]
name = "bead-loop-tools"
version = "0.1.0"
edition = "2021"
description = "Native tools: level generator (bot-verified) and parity trace"
publish = false

[[bin]]
name = "gen-levels"
path = "src/bin/gen_levels.rs"

[[bin]]
name = "trace"
path = "src/bin/trace.rs"

[[bin]]
name = "difficulty"
path = "src/bin/difficulty.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[dependencies]
bead-loop = { path = "../bead-loop" }
playables-core = { path = "../playables-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
